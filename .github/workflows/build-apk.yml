name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LUMIR_KEYSTORE_BASE64: ${{ secrets.LUMIR_KEYSTORE_BASE64 }}
      LUMIR_KEYSTORE_PASSWORD: ${{ secrets.LUMIR_KEYSTORE_PASSWORD }}
      LUMIR_KEY_ALIAS: ${{ secrets.LUMIR_KEY_ALIAS }}
      LUMIR_KEY_PASSWORD: ${{ secrets.LUMIR_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^e: |error:|FAILURE:|What went wrong|Execution failed|Unresolved reference|Type mismatch)' \
              "$RUNNER_TEMP/gradle-build.log" | tail -n 40 | while IFS= read -r line; do
                line=${line//'%'/'%25'}
                line=${line//$'\r'/'%0D'}
                line=${line//$'\n'/'%0A'}
                echo "::error::$line"
              done
          fi
          exit "$status"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumir-debug-arm64-apk
          path: app/build/outputs/apk/debug/*arm64-v8a*debug.apk
          if-no-files-found: error

      - name: Prepare release keystore
        if: ${{ env.LUMIR_KEYSTORE_BASE64 != '' && env.LUMIR_KEYSTORE_PASSWORD != '' && env.LUMIR_KEY_ALIAS != '' && env.LUMIR_KEY_PASSWORD != '' }}
        shell: bash
        run: echo "$LUMIR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumir-release.jks"

      - name: Build signed release APK
        if: ${{ env.LUMIR_KEYSTORE_BASE64 != '' && env.LUMIR_KEYSTORE_PASSWORD != '' && env.LUMIR_KEY_ALIAS != '' && env.LUMIR_KEY_PASSWORD != '' }}
        env:
          LUMIR_KEYSTORE_FILE: ${{ runner.temp }}/lumir-release.jks
        run: gradle --no-daemon --stacktrace --info assembleRelease

      - name: Rename signed release APK
        if: ${{ env.LUMIR_KEYSTORE_BASE64 != '' && env.LUMIR_KEYSTORE_PASSWORD != '' && env.LUMIR_KEY_ALIAS != '' && env.LUMIR_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*arm64-v8a*release.apk')
          test -n "$version"
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" "Lumir.v${version}.apk"

      - name: Upload signed release APK
        if: ${{ env.LUMIR_KEYSTORE_BASE64 != '' && env.LUMIR_KEYSTORE_PASSWORD != '' && env.LUMIR_KEY_ALIAS != '' && env.LUMIR_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lumir-release-arm64-apk
          path: Lumir.v*.apk
          if-no-files-found: error
